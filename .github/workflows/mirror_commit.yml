name: Mirror code to target repository

on:
  push:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    environment: mirror-epitech
    # Skip if running on the target repository
    if: github.repository != vars.GH_TARGET_REPO_NAME

    steps:
      - name: Set up SSH
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.GH_SSH_PRIVATE_KEY }}
          known_hosts: 'github.com'

      - name: Checkout source repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add mirror remote
        env:
          TARGET_REPO: ${{ vars.GH_TARGET_REPO }}
        run: git remote add mirror "${TARGET_REPO}"

      - name: Push current branch to mirror
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          git push mirror HEAD:"refs/heads/$BRANCH" --force
